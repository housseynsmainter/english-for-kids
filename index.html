<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Unscrambler Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .word {
            display: inline-block;
            padding: 8px 12px;
            margin: 5px;
            background-color: #f0f0f0;
            border-radius: 4px;
            cursor: pointer;
        }
        #sentence-container, #scrambled-container {
            min-height: 60px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            padding: 10px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .correct {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Unscramble the Sentence</h1>
    
    <div id="scrambled-container"></div>
    
    <p>Click the words in the correct order:</p>
    
    <div id="sentence-container"></div>
    
    <button id="check-btn">Check Answer</button>
    <button id="new-btn">New Sentence</button>
    
    <p id="feedback"></p>

    <script>
        // Sample sentences
        const sentences = [
            "The quick brown fox jumps over the lazy dog",
            "HTML is fun to work with",
            "JavaScript makes web pages interactive",
            "Practice makes perfect",
            "Learning to code is rewarding"
        ];
        
        let currentSentence = "";
        let scrambledWords = [];
        let selectedWords = [];
        
        // Initialize the game
        function initGame() {
            // Pick a random sentence
            currentSentence = sentences[Math.floor(Math.random() * sentences.length)];
            
            // Split into words and scramble
            scrambledWords = currentSentence.split(' ');
            scrambledWords = scrambleArray(scrambledWords);
            
            // Clear selected words
            selectedWords = [];
            
            // Display scrambled words
            displayScrambledWords();
            
            // Clear sentence container
            document.getElementById('sentence-container').innerHTML = '';
            
            // Clear feedback
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = '';
        }
        
        // Scramble an array
        function scrambleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // Display scrambled words
        function displayScrambledWords() {
            const container = document.getElementById('scrambled-container');
            container.innerHTML = '';
            
            scrambledWords.forEach((word, index) => {
                const wordElement = document.createElement('span');
                wordElement.className = 'word';
                wordElement.textContent = word;
                wordElement.dataset.index = index;
                wordElement.addEventListener('click', selectWord);
                container.appendChild(wordElement);
            });
        }
        
        // Handle word selection
        function selectWord(e) {
            const index = e.target.dataset.index;
            const word = scrambledWords[index];
            
            // Add to selected words
            selectedWords.push(word);
            
            // Remove from scrambled words
            scrambledWords.splice(index, 1);
            
            // Update displays
            displayScrambledWords();
            displaySelectedWords();
        }
        
        // Display selected words in order
        function displaySelectedWords() {
            const container = document.getElementById('sentence-container');
            container.innerHTML = '';
            
            selectedWords.forEach(word => {
                const wordElement = document.createElement('span');
                wordElement.className = 'word';
                wordElement.textContent = word;
                container.appendChild(wordElement);
            });
        }
        
        // Check the answer
        function checkAnswer() {
            const userSentence = selectedWords.join(' ');
            const feedback = document.getElementById('feedback');
            
            if (userSentence === currentSentence) {
                feedback.textContent = "Correct! Well done!";
                feedback.className = "correct";
            } else {
                feedback.textContent = "Not quite right. Try again!";
                feedback.className = "";
            }
        }
        
        // Event listeners
        document.getElementById('check-btn').addEventListener('click', checkAnswer);
        document.getElementById('new-btn').addEventListener('click', initGame);
        
        // Start the game
        initGame();
    </script>
</body>
</html>
